<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quick Clash - ICCC Goats Pinball</title>
<style>  *{box-sizing:border-box}
  html,body{margin:0;background:#1b1b1b;color:#eee;font:14px/1.3 Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
  body{padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
  #app{max-width:980px;margin:0 auto}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  .top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between;border-bottom:1px solid #555;padding-bottom:4px}
  .top h1{font-size:16px;margin:0;letter-spacing:.5px} .top .sub{color:#bdbdbd;font-size:12px}
  .btnS{background:#333;border:1px solid #777;border-radius:5px;padding:5px 9px;min-height:34px}
  .score{display:flex;gap:8px;margin:6px 0}
  .score div{flex:1;background:#2a2a2a;border:1px solid #555;border-radius:6px;padding:4px 8px}
  .score b{font-size:22px;display:block} .score small{color:#bdbdbd}
  .score .cur{border-color:#fff}
  .status{background:#262626;border:1px solid #444;border-radius:6px;padding:5px 8px;margin-bottom:6px;min-height:34px}
  .status b{color:#fff}
  .lbl{font-size:11px;color:#9e9e9e;letter-spacing:.6px;margin:4px 0 2px}
  .row{display:flex;gap:6px}
  .slot{flex:1 1 0;min-width:0;min-height:86px;border:1px dashed #616161;border-radius:7px;padding:5px;background:#222;text-align:left;display:flex;flex-direction:column;gap:2px}
  .slot.empty{color:#757575;justify-content:center;align-items:center}
  .slot.tgt{border:2px solid #fff;background:#3a3a3a}
  .slot.sel{border:2px solid #ffd54f}
  .slot.cov{background:#262a26}
  .card{border:1px solid #9e9e9e;border-radius:7px;background:#3a3a3a;padding:5px;text-align:left;display:flex;flex-direction:column;gap:2px}
  .nm{font-weight:bold;font-size:13px} .st{font-size:13px} .st b{font-size:15px}
  .tx{font-size:11px;color:#cfcfcf} .tg{font-size:10.5px;color:#bdbdbd}
  .tg i{font-style:normal;border:1px solid #757575;border-radius:3px;padding:0 3px;margin-right:3px;display:inline-block}
  .lanes{display:flex;gap:6px;margin:3px 0}
  .lanes span{flex:1 1 0;text-align:center;font-size:11px;border-radius:4px;padding:2px 0;background:#2a2a2a;color:#9e9e9e}
  .lanes span.open{background:#3d3d3d;color:#fff;border:1px solid #9e9e9e}
  .lanes button{flex:1 1 0;font-size:12px;font-weight:bold;border-radius:4px;padding:4px 0;background:#e0e0e0;color:#111;border:0;min-height:32px}
  .hand{display:flex;flex-wrap:wrap;gap:6px}
  .hand .card{flex:1 1 150px;min-width:140px;max-width:240px}
  .hand .card.no{opacity:.55} .hand .card.sel{border:2px solid #ffd54f;background:#4a4a4a}
  .ctl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .ctl button{flex:1 1 150px;min-height:44px;border-radius:6px;border:0;background:#e0e0e0;color:#111;font-weight:bold;font-size:15px}
  .ctl button.alt{background:#424242;color:#eee;border:1px solid #9e9e9e}
  .ctl button[disabled]{opacity:.4;cursor:default}
  .log{background:#202020;border:1px solid #3a3a3a;border-radius:6px;padding:5px 8px;font-size:12px;color:#cfcfcf;max-height:150px;overflow-y:auto}
  .log div{padding:1px 0;border-bottom:1px solid #2a2a2a}
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:8px}
  .box{background:#2a2a2a;border:2px solid #9e9e9e;border-radius:10px;padding:10px;width:min(640px,100%);max-height:calc(100dvh - 16px);overflow-y:auto}
  .box h2{margin:0 0 6px;font-size:18px} .box p{margin:4px 0}
  .pick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .pick .card{flex:1 1 160px;min-width:150px;cursor:pointer}
  .big{font-size:26px;font-weight:bold;margin:4px 0}
  .res{max-width:640px;margin:10px auto;background:#262626;border:1px solid #555;border-radius:10px;padding:12px}
  .res .ctl button{flex-basis:100%}
  .note{color:#bdbdbd;font-size:12px}
  @media (max-width:420px){ .slot{min-height:78px;padding:4px} .nm{font-size:12px} .tx{display:none} .hand .card .tx{display:block} .hand .card{flex-basis:46%;min-width:0} }
</style>
</head>

    h += '<div class="score"><div class="' + (S.current === 'player' ? 'cur' : '') + '"><small>YOU &middot; turn ' + me.turnsTaken + '/' + QC.TURNS_EACH + '</small><b>' + scoreStr(me) + '</b><small>Wickets ' + wkDown(me) + '/' + QC.WICKETS + ' &middot; deck ' + me.deck.length + '</small></div><div class="' + (S.current === 'ai' ? 'cur' : '') + '"><small>' + esc(S.rivalName.toUpperCase()) + ' &middot; turn ' + ai.turnsTaken + '/' + QC.TURNS_EACH + '</small><b>' + scoreStr(ai) + '</b><small>Wickets ' + wkDown(ai) + '/' + QC.WICKETS + ' &middot; hand ' + ai.hand.length + '</small></div></div>';
    var stx = S.current === 'ai' ? '<b>' + esc(S.rivalName) + '</b> is playing (' + ph + ')...' : ph === 'main' ? '<b>Your Main Phase</b> &middot; Overs ' + me.overs + '/' + me.maxOvers + (binOff(me) ? ' &middot; next card -1 Over' : '') + ' &middot; tap a hand card, then a slot' : ph === 'action' ? '<b>Your Action Phase</b> &middot; tap a ready card on your pitch, then a target' : '<b>Your turn</b> (' + ph + ')';
    if (selHand) { var cp = canPlay(me, selC); stx += '<br>' + esc(noThe(selC.name)) + ': ' + (cp.ok ? (selC.type === 'strategy' ? (ppT ? 'tap one of your batters' : 'tap PLAY') : 'tap an empty slot on your pitch') : cp.why); }
    if (tg) stx += '<br>' + esc(noThe(selC.name)) + ': ' + (tg.slots.length || tg.direct ? 'tap a lit target' : 'nothing to hit');
    h += '<div class="status">' + stx + '</div>';
    h += '<div class="lbl">' + esc(S.rivalName.toUpperCase()) + ' PITCH</div><div class="row">' + ai.pitch.map(function (c, i) {
      var t = tg && tg.slots.indexOf(i) >= 0; return c ? '<div class="slot card' + (t ? ' tgt' : '') + '"' + (t ? ' role="button" data-a="hit" data-i="' + i + '"' : '') + '>' + cardHTML(c, ai) + '</div>' : '<div class="slot empty">empty</div>'; }).join('') + '</div>';
    var lanes = directLanes(ai), cov = guardCover(ai);
    h += '<div class="lanes">' + [0, 1, 2].map(function (i) { if (tg && tg.direct && tg.lanes.indexOf(i) >= 0) return '<button data-a="direct" data-i="' + i + '">STUMPS via ' + (i + 1) + '</button>'; return '<span class="' + (lanes.indexOf(i) >= 0 ? 'open' : '') + '">' + (ai.pitch[i] ? 'slot ' + (i + 1) : lanes.indexOf(i) >= 0 ? 'stumps open' : cov[i] ? 'guarded' : '-') + '</span>'; }).join('') + '</div>';
    h += '<div class="lbl">YOUR PITCH</div><div class="row">' + me.pitch.map(function (c, i) {
      if (!c) { var can = selHand && selC.type !== 'strategy' && canPlay(me, selC).ok; return '<div class="slot empty' + (can ? ' tgt' : '') + '"' + (can ? ' role="button" data-a="place" data-i="' + i + '"' : '') + '>' + (can ? 'PLAY HERE' : 'empty') + '</div>'; }
      var pp = ppT && ppT.some(function (t) { return t.slot === i; }), ready = mine && ph === 'action' && canAct(me, c) && hasAction('player', c);
      return '<div class="slot card' + (selC === c ? ' sel' : pp || ready ? ' tgt' : '') + '" role="button" data-a="' + (pp ? 'pp' : 'mine') + '" data-i="' + i + '" data-u="' + c.uid + '">' + cardHTML(c, me) + '</div>'; }).join('') + '</div>';
    h += '<div class="lbl">YOUR HAND (' + me.hand.length + '/' + QC.HAND_LIMIT + ')</div><div class="hand">' + me.hand.map(function (c) {
      var ok = mine && ph === 'main' && canPlay(me, c).ok; return '<div class="card' + (ok ? '' : ' no') + (sel === c.uid ? ' sel' : '') + '" role="button" tabindex="0" data-a="hand" data-u="' + c.uid + '">' + cardHTML(c, null, costOf(me, c) + ' Over' + (costOf(me, c) === 1 ? '' : 's')) + '</div>'; }).join('') + '</div>';
    h += '<div class="ctl">';
    if (selHand && selC.type === 'strategy' && !ppT && canPlay(me, selC).ok) h += '<button data-a="playS">PLAY ' + esc(noThe(selC.name).toUpperCase()) + '</button>';
    h += '<button data-a="toAction"' + (mine && ph === 'main' && !S.pending && !S.tossPick ? '' : ' disabled') + '>TO ACTION &#9654;</button><button data-a="endTurn"' + (mine && ph === 'action' ? '' : ' disabled') + '>END TURN &#9654;</button></div>';
    h += '<div class="lbl">LOG</div><div class="log" id="log">' + S.log.slice(-14).map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>';
    if (S.pending && S.pending.kind === 'review') h += '<div class="dim"><div class="box"><h2>Third Umpire Review</h2><p>Keep 1, the rest are binned:</p><div class="pick">' + me.reviewing.map(function (c, i) { return '<div class="card" role="button" tabindex="0" data-a="review" data-i="' + i + '">' + cardHTML(c, null, c.cost + ' Overs') + '</div>'; }).join('') + '</div></div></div>';
    else if (S.tossPick && S.tossPick.q.length) { var nw = S.tossPick.q[0]; h += '<div class="dim"><div class="box"><h2>Hand full</h2><p>You drew <b>' + esc(noThe(nw.name)) + '</b>. Pick one card to bin (your next card this Main Phase costs 1 fewer Over):</p><div class="pick">' + [nw].concat(me.hand).map(function (c) { return '<div class="card" role="button" tabindex="0" data-a="toss" data-u="' + c.uid + '">' + cardHTML(c, null, (c === nw ? 'NEW &middot; ' : '') + c.cost + ' Overs') + '</div>'; }).join('') + '</div></div></div>'; }
    if (ui.confirmQuit) h += '<div class="dim"><div class="box"><h2>Forfeit this Clash?</h2><p>It counts as a loss.' + (H.stake ? ' The ' + H.stake + ' MP bet is lost.' : ' Nothing else is lost.') + '</p><div class="ctl"><button data-a="quitYes">FORFEIT</button><button class="alt" data-a="quitNo">KEEP PLAYING</button></div></div></div>';
    app.innerHTML = h; var lg = document.getElementById('log'); if (lg) lg.scrollTop = lg.scrollHeight;
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a'), i = +b.getAttribute('data-i'), u = +b.getAttribute('data-u'), k = b.getAttribute('data-k');
    if (a === 'back') { location.href = backUrl(); return; }
    if (a === 'pick' || a === 'swap' || a === 'nopick' || a === 'unpick') { pickAction(a, k); return; }

    if (a === 'quitNo') { ui.confirmQuit = false; render(); return; }
    if (a === 'quitYes') { ui.confirmQuit = false; forfeit(); return; }
    var me = P('player');
    if (a === 'review') { resolveReview('player', i); save(); render(); return; }
    if (a === 'toss') { resolveToss(u); return; }
    if (!myTurn('player')) return;
    if (a === 'hand') { if (S.phase !== 'main') return; sel = sel === u ? null : u; render(); return; }
    if (a === 'place') { if (sel != null && playCard('player', sel, null, i)) { sel = null; S.pSteps++; save(); } render(); return; }
    if (a === 'pp') { if (sel != null && playCard('player', sel, { side: 'player', slot: i })) { sel = null; S.pSteps++; save(); } render(); return; }
    if (a === 'playS') { if (sel != null && playCard('player', sel, null)) { sel = null; S.pSteps++; save(); } render(); return; }
    if (a === 'mine') { if (S.phase !== 'action') return; var c = me.pitch[i]; sel = c && canAct(me, c) && hasAction('player', c) && sel !== c.uid ? c.uid : null; render(); return; }
    if (a === 'hit' || a === 'direct') { if (sel != null) { if (a === 'hit') act('player', sel, i); else act('player', sel, 'direct', i); S.pSteps++; sel = null; if (!S.over) save(); } render(); return; }
    if (a === 'toAction') { enterAction('player'); return; }
    if (a === 'endTurn') { enterEnd('player'); return; }
  });
  app.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-a')) { e.preventDefault(); e.target.click(); } });
  function pickAction(a, k) {
    if (!H || H.state !== 'done' || !H.result || !H.result.win || H.result.cardPicked != null) return;
    var r = H.result, deck = H.deck || QC.STARTER;
    if (a === 'unpick') { ui.pickKey = null; render(); return; }
    if (a === 'nopick') { r.cardPicked = ''; }
    else if (a === 'pick') { if (r.offer.indexOf(k) < 0) return; if (deck.length >= QC.DECK_CAP) { ui.pickKey = k; render(); return; } r.cardPicked = k; }
    else if (a === 'swap') { if (!ui.pickKey || deck.indexOf(k) < 0) return; r.cardPicked = ui.pickKey; r.swapOut = k; }
    var h = lsGet(HAND_KEY); if (h && h.id === H.id && h.state === 'done') { h.result.cardPicked = r.cardPicked; h.result.swapOut = r.swapOut || null; lsSet(HAND_KEY, h); H = h; }
    ui.pickKey = null; render();

  function boot() {
    var q = new URLSearchParams(location.search).get('h'), h = lsGet(HAND_KEY);
    if (!h || h.v !== 1 || !h.id || ['pending', 'playing', 'done', 'claimed'].indexOf(h.state) < 0) { H = null; render(); return; }

    if (h.state === 'playing' && m && m.v === 1 && m.id === h.id && m.S && m.S.v === 1) { S = m.S; render(); kick(); return; }

    newMatch(h);
  }
