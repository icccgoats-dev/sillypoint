  #app .qc-dock .hand.qc-hand .hc.gcard { width:calc((100% - 48px) / 3); }
}
@media (min-width:800px) and (max-height:860px) and (min-height:501px) {
  #app .qc-dock .hand.qc-hand { gap:8px 8px; padding:16px 2px 2px; }
  #app .qc-dock .hand.qc-hand .hc { zoom:.86; }
}
@media (min-width:800px) and (max-height:780px) and (min-height:501px) {
  #app .qc-dock .hand.qc-hand { gap:6px 8px; padding-top:14px; }
  #app .qc-dock .hand.qc-hand .hc { zoom:.8; }
}
@media (min-width:800px) and (max-height:500px) {
  #app .qc-dock .hand.qc-hand { flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain; scroll-snap-type:x proximity; gap:6px; padding:12px 2px 6px 10px; scroll-padding-left:10px; scrollbar-width:thin; }
  #app .qc-dock .hand.qc-hand .hc.gcard { width:calc((100% - 48px) / 3); max-width:7.6rem; flex:0 0 auto; scroll-snap-align:start; }
  #app:has(> .qc-field):has(> #qcTip) > #qcTip { grid-column:1; grid-row:4; }
  #app:has(> .qc-field):has(> #qcTip) > .qc-field { grid-row:5; }
  #app:has(> .qc-field):has(> #qcTip) > .qc-dock { grid-column:2; grid-row:4 / span 2; }
}
#app .qc-bcard{outline:2px dashed #9e9e9e;outline-offset:-4px}
#app .qc-bgem{font-size:16px}
</style>
